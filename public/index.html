<script type="text/plain" data-disabled="broken-ai-actions">
var AIActions = (function () {

  var editorEl = null;
  function getEditor() {
    if (!editorEl) editorEl = document.getElementById("editor");
    return editorEl;
  }

  /** Core: call /api/generate SSE and stream result into editor */
  function _streamGenerate(task, promptText) {
    var editor = getEditor();
    if (!editor) { LayoutSkill.showToast("❌ 编辑器未就绪，请先选择章节"); return; }

    LayoutSkill.showToast("🤖 AI 生成中…");
    editor.disabled = true;

    fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        task: task,
        userPrompt: promptText,
        maxTokens: 6000
      })
    }).then(function (response) {
      if (!response.ok) throw new Error("HTTP " + response.status);

      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buffer = "";
      var result = "";
      var isDemo = false;
      var streamDone = false;

      function read() {
        reader.read().then(function (chunk) {
          if (chunk.done) {
            editor.disabled = false;
            var charCount = result.replace(/s/g, "").length;
            if (charCount > 0) {
              LayoutSkill.showToast(isDemo ? "✅ 演示内容已生成（" + charCount + " 字）" : "✅ 生成完成（" + charCount + " 字）");
              if (typeof LayoutSkill !== "undefined" && LayoutSkill.saveChapter) {
                setTimeout(function () { LayoutSkill.saveChapter(); }, 500);
              }
            } else {
              LayoutSkill.showToast("⚠️ AI 未返回内容，请检查 API Key 配置");
            }
            return;
          }

          buffer += decoder.decode(chunk.value, { stream: true });
          var lines = buffer.split("
");
          buffer = lines.pop() || "";

          for (var i = 0; i < lines.length; i++) {
            var line = lines[i];
            var trimmed = line.trim();
            if (!trimmed || !trimmed.startsWith("data: ")) continue;
            var data = trimmed.slice(6);
            try {
              var json = JSON.parse(data);
              if (json.token) {
                result += json.token;
                editor.value = result;
                editor.scrollTop = editor.scrollHeight;
              }
              if (json.status === "demo") {
                isDemo = true;
                LayoutSkill.showToast("📝 演示模式（需配置 API Key）");
              }
              if (json.error) {
                editor.disabled = false;
                LayoutSkill.showToast("❌ " + json.error);
                streamDone = true;
              }
              if (json.done) streamDone = true;
            } catch (e) {}
          }

          if (!streamDone) read();
        }).catch(function (err) {
          editor.disabled = false;
          LayoutSkill.showToast("❌ " + err.message);
        });
      }

      read();
    }).catch(function (err) {
      editor.disabled = false;
      LayoutSkill.showToast("❌ 请求失败: " + err.message);
    });
  }

  function _getProjectId() {
    if (typeof LayoutSkill !== "undefined" && LayoutSkill.getActiveProjectId) {
      return LayoutSkill.getActiveProjectId();
    }
    return null;
  }

  return {
    generateChapter: function () {
      var chapter = (typeof LayoutSkill !== "undefined" && LayoutSkill.getActiveChapter)
        ? LayoutSkill.getActiveChapter()
        : null;
      if (!chapter) {
        LayoutSkill.showToast("请先在左侧选择或创建一个章节");
        return;
      }
      var parts = ["请根据以下信息生成一章完整的小说正文。", ""];
      if (chapter.title) parts.push("【章节标题】" + chapter.title);
      if (chapter.summary) parts.push("【章节摘要】" + chapter.summary);
      var project = (typeof LayoutSkill !== "undefined" && LayoutSkill.getState) ? LayoutSkill.getState().activeProject : null;
      if (project) {
        parts.push("【作品名称】" + (project.name || ""));
        parts.push("【作品类型】" + (project.genre || ""));
      }
      parts.push("");
      parts.push("写作要求：文笔流畅，有画面感，字数2000-4000字。输出纯正文，不要输出设定说明。");
      _streamGenerate("chapter_generate", parts.join("
"));
    },

    continueChapter: function () {
      var editor = getEditor();
      var currentText = editor ? (editor.value || "").slice(-800) : "";
      if (!currentText.trim()) {
        LayoutSkill.showToast("请先选择章节或输入一些内容");
        return;
      }
      var promptText = "请续写以下内容，保持风格、人物和世界观一致：

" + currentText + "

---
请从以上内容结束处自然续写。";
      _streamGenerate("chapter_continue", promptText);
    }
  };
})();
</script>
<script>
var AIActions = (function () {
  var editorEl = null;

  function getEditor() {
    if (!editorEl) editorEl = document.getElementById("editor");
    return editorEl;
  }

  function toast(message) {
    if (typeof LayoutSkill !== "undefined" && LayoutSkill.showToast) {
      LayoutSkill.showToast(message);
    }
  }

  function streamGenerate(task, promptText, onDone) {
    var editor = getEditor();
    if (!editor) {
      toast("编辑器未就绪，请先选择章节");
      if (onDone) onDone();
      return;
    }

    toast("AI 生成中...");
    editor.disabled = true;

    fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task: task, userPrompt: promptText, maxTokens: 6000 })
    }).then(function (response) {
      if (!response.ok) throw new Error("HTTP " + response.status);

      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buffer = "";
      var result = "";
      var isDemo = false;
      var streamDone = false;

      function read() {
        reader.read().then(function (chunk) {
          if (chunk.done) {
            editor.disabled = false;
            if (onDone) onDone();
            var charCount = result.replace(/\s/g, "").length;
            if (charCount > 0) {
              toast(isDemo ? "演示内容已生成（" + charCount + " 字）" : "生成完成（" + charCount + " 字）");
              if (typeof LayoutSkill !== "undefined" && LayoutSkill.saveChapter) {
                setTimeout(function () { LayoutSkill.saveChapter(); }, 500);
              }
            } else {
              toast("AI 未返回内容，请检查 API Key 配置");
            }
            return;
          }

          buffer += decoder.decode(chunk.value, { stream: true });
          var lines = buffer.split("\n");
          buffer = lines.pop() || "";

          for (var i = 0; i < lines.length; i++) {
            var trimmed = lines[i].trim();
            if (!trimmed || !trimmed.startsWith("data: ")) continue;
            try {
              var json = JSON.parse(trimmed.slice(6));
              if (json.token) {
                result += json.token;
                editor.value = result;
                editor.scrollTop = editor.scrollHeight;
              }
              if (json.status === "demo") isDemo = true;
              if (json.error) {
                editor.disabled = false;
                toast("生成失败：" + json.error);
                streamDone = true;
              }
              if (json.done) streamDone = true;
            } catch (e) {}
          }

          if (!streamDone) read();
        }).catch(function (err) {
          editor.disabled = false;
          toast("生成失败：" + err.message);
        });
      }

      read();
    }).catch(function (err) {
      editor.disabled = false;
      toast("请求失败：" + err.message);
    });
  }

  function _updateGenContext(chapter, charNames, projectName) {
    var container = document.getElementById("right-content");
    if (!container) return;
    var html = '<div class="section"><div class="section-title">🤖 本次生成上下文</div>';
    html += '<div class="ctx-item"><div class="ctx-label">章节</div><div class="ctx-value">' + (chapter.title || "未命名") + '</div></div>';
    if (chapter.summary) {
      html += '<div class="ctx-item"><div class="ctx-label">剧情种子</div><div class="ctx-value">' + chapter.summary + '</div></div>';
    }
    if (projectName) {
      html += '<div class="ctx-item"><div class="ctx-label">作品</div><div class="ctx-value">' + projectName + '</div></div>';
    }
    html += '<div class="ctx-item"><div class="ctx-label">注入人物</div><div class="ctx-value">' + (charNames.length > 0 ? charNames.join("、") : "无（未加载到人物设定）") + '</div></div>';
    html += '</div>';
    container.innerHTML = html;
  }

  return {
    generateChapter: function () {
      var chapter = (typeof LayoutSkill !== "undefined" && LayoutSkill.getActiveChapter)
        ? LayoutSkill.getActiveChapter()
        : null;
      if (!chapter) {
        toast("请先在左侧选择或创建一个章节");
        return;
      }

      var project = (typeof LayoutSkill !== "undefined" && LayoutSkill.getState)
        ? LayoutSkill.getState().activeProject
        : null;
      var projectId = project ? project.id : null;

      // Button loading state
      var genBtn = document.querySelector(".ai-btn.primary");
      if (genBtn) { genBtn.disabled = true; genBtn.textContent = "⏳ 生成中..."; }

      function doGenerate(characters) {
        var parts = ["请根据以下信息生成一章完整的小说正文。", ""];
        if (chapter.title) parts.push("【章节标题】" + chapter.title);
        if (chapter.summary) parts.push("【章节摘要】" + chapter.summary);
        if (project) {
          parts.push("【作品名称】" + (project.name || ""));
          parts.push("【作品类型】" + (project.genre || ""));
        }

        var charNames = [];
        if (characters && characters.length > 0) {
          parts.push("");
          parts.push("【相关人物设定】");
          characters.forEach(function (c) {
            var desc = c.summary || c.description || "";
            parts.push("- " + c.name + (desc ? "：" + desc : ""));
            charNames.push(c.name);
          });
        }

        parts.push("");
        parts.push("写作要求：文笔流畅，有画面感，字数 2000-4000 字。输出纯正文，不要输出设定说明。");

        _updateGenContext(chapter, charNames, project ? project.name : null);

        streamGenerate("chapter_generate", parts.join("\n"), function () {
          if (genBtn) { genBtn.disabled = false; genBtn.textContent = "✨ 生成本章"; }
        });
      }

      // Fetch characters from Story Bible for context enrichment
      if (projectId) {
        fetch("/api/items?projectId=" + encodeURIComponent(projectId) + "&type=character&limit=30")
          .then(function (r) { return r.json(); })
          .then(function (result) {
            var characters = (result.success && result.data && result.data.items) ? result.data.items : [];
            doGenerate(characters);
          })
          .catch(function () {
            doGenerate([]);
          });
      } else {
        doGenerate([]);
      }
    },

    continueChapter: function () {
      var editor = getEditor();
      var currentText = editor ? (editor.value || "").slice(-800) : "";
      if (!currentText.trim()) {
        toast("请先选择章节或输入一些内容");
        return;
      }

      var promptText = [
        "请续写以下内容，保持风格、人物和世界观一致：",
        "",
        currentText,
        "",
        "---",
        "请从以上内容结束处自然续写。"
      ].join("\n");
      streamGenerate("chapter_continue", promptText);
    }
  };
})();
</script>
<script>
var AIActions = (function () {
  function editor() {
    return document.getElementById("editor");
  }

  function toast(message) {
    if (window.LayoutSkill && LayoutSkill.showToast) LayoutSkill.showToast(message);
  }

  function setGenerateButton(loading) {
    var btn = document.querySelector(".ai-btn.primary");
    if (!btn) return;
    btn.disabled = !!loading;
    btn.textContent = loading ? "生成中..." : "生成本章";
  }

  function activeChapter() {
    return window.LayoutSkill && LayoutSkill.getActiveChapter ? LayoutSkill.getActiveChapter() : null;
  }

  function activeProject() {
    return window.LayoutSkill && LayoutSkill.getState ? LayoutSkill.getState().activeProject : null;
  }

  /**
   * 在右侧面板展示本次生成使用的上下文条目
   */
  function showGenContext(usedItems) {
    var container = document.getElementById("right-content");
    if (!container) return;

    var html = '<div class="section"><div class="section-title">🤖 本次生成使用了</div>';

    // 人物
    html += '<div class="ctx-group">';
    html += '<div class="ctx-group-icon">👤</div><div class="ctx-group-label">人物</div>';
    if (usedItems.characters && usedItems.characters.length > 0) {
      html += '<div class="ctx-group-items">' + usedItems.characters.map(function (name) {
        return '<span class="ctx-tag ctx-tag-char" onclick="AIActions._jumpToBible(\'character\',\'' + escAttr(name) + '\')" title="跳转到人物">' + escHtml(name) + '</span>';
      }).join("") + '</div>';
    } else {
      html += '<span class="ctx-none">无</span>';
    }
    html += '</div>';

    // 地点
    html += '<div class="ctx-group">';
    html += '<div class="ctx-group-icon">📍</div><div class="ctx-group-label">地点</div>';
    if (usedItems.locations && usedItems.locations.length > 0) {
      html += '<div class="ctx-group-items">' + usedItems.locations.map(function (name) {
        return '<span class="ctx-tag ctx-tag-loc" onclick="AIActions._jumpToBible(\'location\',\'' + escAttr(name) + '\')" title="跳转到地点">' + escHtml(name) + '</span>';
      }).join("") + '</div>';
    } else {
      html += '<span class="ctx-none">无</span>';
    }
    html += '</div>';

    // 势力
    html += '<div class="ctx-group">';
    html += '<div class="ctx-group-icon">🏛</div><div class="ctx-group-label">势力</div>';
    if (usedItems.factions && usedItems.factions.length > 0) {
      html += '<div class="ctx-group-items">' + usedItems.factions.map(function (name) {
        return '<span class="ctx-tag ctx-tag-fac" onclick="AIActions._jumpToBible(\'faction\',\'' + escAttr(name) + '\')" title="跳转到势力">' + escHtml(name) + '</span>';
      }).join("") + '</div>';
    } else {
      html += '<span class="ctx-none">无</span>';
    }
    html += '</div>';

    // 规则
    html += '<div class="ctx-group">';
    html += '<div class="ctx-group-icon">📜</div><div class="ctx-group-label">规则</div>';
    if (usedItems.rules && usedItems.rules.length > 0) {
      html += '<div class="ctx-group-items">' + usedItems.rules.map(function (name) {
        return '<span class="ctx-tag ctx-tag-rule">' + escHtml(name) + '</span>';
      }).join("") + '</div>';
    } else {
      html += '<span class="ctx-none">无</span>';
    }
    html += '</div>';

    // 前情
    html += '<div class="ctx-group">';
    html += '<div class="ctx-group-icon">📖</div><div class="ctx-group-label">前情</div>';
    html += '<span class="ctx-value">' + escHtml(usedItems.prevChapter || "无") + '</span>';
    html += '</div>';

    // 伏笔
    html += '<div class="ctx-group">';
    html += '<div class="ctx-group-icon">🎯</div><div class="ctx-group-label">伏笔</div>';
    if (usedItems.futureScenes && usedItems.futureScenes.length > 0) {
      html += '<div class="ctx-group-items">' + usedItems.futureScenes.map(function (name) {
        return '<span class="ctx-tag ctx-tag-fore">' + escHtml(name) + '</span>';
      }).join("") + '</div>';
    } else {
      html += '<span class="ctx-none">无</span>';
    }
    html += '</div>';

    html += '</div>'; // .section
    container.innerHTML = html;
  }

  function escHtml(s) {
    if (!s) return "";
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function escAttr(s) {
    if (!s) return "";
    return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function streamGenerate(task, promptText) {
    var ed = editor();
    var chapter = activeChapter();
    var project = activeProject();
    if (!ed || !chapter) {
      toast("请先新建并选择章节");
      return;
    }

    var hadError = false;
    var result = "";
    var genUsedItems = null;
    ed.disabled = true;
    setGenerateButton(true);
    toast("AI 生成中...");

    fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        task: task,
        userPrompt: promptText,
        chapterId: chapter.id,
        projectId: project ? project.id : null,
        chapterTitle: chapter.title || "",
        chapterSummary: chapter.summary || "",
        projectGenre: project ? (project.genre || "") : "",
        maxTokens: 6000
      })
    }).then(function (response) {
      if (!response.ok) {
        return response.json().catch(function () { return {}; }).then(function (json) {
          throw new Error(json.error || ("HTTP " + response.status));
        });
      }

      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buffer = "";

      function read() {
        return reader.read().then(function (chunk) {
          if (chunk.done) return;
          buffer += decoder.decode(chunk.value, { stream: true });
          var lines = buffer.split("\n");
          buffer = lines.pop() || "";

          lines.forEach(function (line) {
            var trimmed = line.trim();
            if (!trimmed || !trimmed.startsWith("data: ")) return;
            try {
              var json = JSON.parse(trimmed.slice(6));
              if (json.error) {
                hadError = true;
                toast(json.error);
                return;
              }
              if (json.token && !hadError) {
                result += json.token;
                ed.value = result;
                ed.scrollTop = ed.scrollHeight;
              }
              if (json.done) {
                genUsedItems = json.usedItems || null;
              }
            } catch (e) {}
          });

          if (!hadError) return read();
        });
      }

      return read();
    }).then(function () {
      ed.disabled = false;
      setGenerateButton(false);
      if (hadError) return;
      if (!result.trim()) {
        toast("AI 未返回内容");
        return;
      }
      // 展示上下文
      if (genUsedItems) {
        showGenContext(genUsedItems);
      }
      toast("生成完成，正在保存...");
      if (window.LayoutSkill && LayoutSkill.saveChapter) {
        LayoutSkill.saveChapter().then(function () { toast("生成内容已保存"); });
      }
    }).catch(function (err) {
      ed.disabled = false;
      setGenerateButton(false);
      toast(err.message || "生成失败");
    });
  }

  function buildChapterPrompt(prefix) {
    var chapter = activeChapter();
    var ed = editor();
    var lines = [prefix || "请根据以上设定生成章节正文。"];
    if (ed && ed.value.trim()) {
      lines.push("");
      lines.push("【当前已有正文（请从结尾自然续写）】");
      lines.push(ed.value.slice(-1200));
    }
    return lines.join("\n");
  }

  /** 跳转到故事圣经对应类型条目 */
  function jumpToBible(expectedType, name) {
    if (window.LayoutSkill && LayoutSkill.switchTab) {
      LayoutSkill.switchTab("bible");
    }
    // 延迟等 bible DOM 渲染完成后设置搜索
    setTimeout(function () {
      if (window.StoryBible && typeof StoryBible.search === "function") {
        StoryBible.search(name, expectedType);
      }
    }, 600);
  }

  /** 定稿章节：生成 autoSummary + 扫描新设定 */
  function finalizeChapter() {
    var chapter = activeChapter();
    var project = activeProject();
    if (!chapter || !project) {
      toast("请先选择章节和项目");
      return;
    }
    var ed = editor();
    if (!ed || !ed.value.trim()) {
      toast("章节无正文内容，无法定稿");
      return;
    }

    var btn = document.getElementById("finalize-btn");
    if (btn) { btn.disabled = true; btn.textContent = "⏳ 定稿中..."; }
    toast("正在生成摘要并扫描新设定...");

    fetch("/api/projects/" + encodeURIComponent(project.id) + "/chapters/" + encodeURIComponent(chapter.id) + "/finalize", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
    })
    .then(function (r) { return r.json(); })
    .then(function (result) {
      if (btn) { btn.disabled = false; btn.textContent = "✅ 定稿"; }
      if (!result.success) {
        toast("定稿失败: " + (result.error || "未知错误"));
        return;
      }

      var data = result.data || {};
      var hasSummary = data.autoSummary ? true : false;
      var sugCount = data.suggestions ? data.suggestions.length : 0;

      // 更新本地章节缓存
      if (chapter) { chapter.status = "finalized"; }

      // 更新 meta 显示
      var metaEl = document.getElementById("ch-meta");
      if (metaEl) {
        var wc = chapter.wordCount || 0;
        metaEl.textContent = wc.toLocaleString() + " 字 · 已定稿";
      }

      // 展示结果
      if (sugCount > 0) {
        showSuggestions(data.suggestions, project.id, chapter.id);
        toast("✅ 定稿完成 — 摘要已生成，发现 " + sugCount + " 条新设定");
      } else {
        showSuggestions([], project.id, chapter.id);
        toast("✅ 定稿完成 — 摘要已生成，未发现新设定");
      }
    })
    .catch(function (err) {
      if (btn) { btn.disabled = false; btn.textContent = "✅ 定稿"; }
      toast("定稿请求失败: " + err.message);
    });
  }

  /** 在右侧面板展示定稿结果：摘要状态 + 新设定建议 */
  function showSuggestions(suggestions, projectId, chapterId) {
    var container = document.getElementById("right-content");
    if (!container) return;

    var html = '<div class="section"><div class="section-title">✅ 定稿完成</div>';

    // 摘要状态
    html += '<div style="font-size:13px;color:#5aab8a;margin-bottom:12px">📝 本章摘要已自动生成</div>';

    // 建议列表
    if (suggestions && suggestions.length > 0) {
      html += '<div style="font-size:11px;color:#d4a574;margin-bottom:10px">📌 发现 ' + suggestions.length + ' 条新设定，点击加入故事圣经：</div>';

      for (var i = 0; i < suggestions.length; i++) {
        var s = suggestions[i];
        var typeLabel = { character: "👤人物", location: "📍地点", faction: "🏛势力", rule: "📜规则" }[s.type] || s.type;
        html +=
          '<div class="suggestion-card" id="sug-' + i + '">' +
          '<div class="sug-header">' +
          '<span class="sug-type">' + typeLabel + '</span>' +
          '<span class="sug-name">' + escHtml(s.name) + '</span>' +
          '</div>' +
          '<div class="sug-content">' + escHtml(s.content) + '</div>' +
          '<div class="sug-reason">💡 ' + escHtml(s.reason || "") + '</div>' +
          '<div class="sug-actions">' +
          '<button class="sug-add-btn" id="sug-add-' + i + '" onclick="AIActions._addToBible(\'' + i + '\')">➕ 加入故事圣经</button>' +
          '<span class="sug-status" id="sug-status-' + i + '" style="display:none"></span>' +
          '</div>' +
          '</div>';
      }
    } else {
      html += '<div style="font-size:12px;color:#6b6880">未发现需要新增的设定条目。</div>';
    }

    html += '</div>';
    container.innerHTML = html;

    // 缓存 suggestions 数据以便回调使用
    container._suggestions = suggestions;
    container._sugProjectId = projectId;
  }

  /** 将一条建议加入故事圣经 */
  function addToBible(index) {
    var container = document.getElementById("right-content");
    if (!container || !container._suggestions) return;
    var suggestions = container._suggestions;
    var projectId = container._sugProjectId;
    var s = suggestions[index];
    if (!s) return;

    var addBtn = document.getElementById("sug-add-" + index);
    var statusEl = document.getElementById("sug-status-" + index);
    if (addBtn) { addBtn.disabled = true; addBtn.textContent = "⏳ 正在添加..."; }

    // 构建带默认值的 attrs，character 类型补充 personality
    var attrs = KnowledgeSkill.buildAttrs(s.type, {});
    if (s.type === 'character' && !attrs.personality) {
      attrs.personality = '待补充';
    }

    KnowledgeSkill.create({
      projectId: projectId,
      type: s.type,
      name: s.name,
      summary: s.content || "",
      description: s.content || "",
      tags: ["AI提取"],
      attrs: attrs
    }).then(function (result) {
      if (result.success) {
        if (addBtn) { addBtn.style.display = "none"; }
        if (statusEl) { statusEl.style.display = "inline"; statusEl.textContent = "✅ 已加入"; statusEl.style.color = "#5aab8a"; }
        toast("已加入故事圣经：" + s.name);
        // 刷新故事圣经
        if (window.StoryBible && StoryBible.refresh) {
          StoryBible.refresh();
        }
      } else {
        if (addBtn) { addBtn.disabled = false; addBtn.textContent = "➕ 加入故事圣经"; }
        toast("添加失败：" + (result.error || "未知错误"));
      }
    }).catch(function (err) {
      if (addBtn) { addBtn.disabled = false; addBtn.textContent = "➕ 加入故事圣经"; }
      toast("请求失败：" + err.message);
    });
  }

  return {
    generateChapter: generateChapter,
    continueChapter: continueChapter,
    finalizeChapter: finalizeChapter,
    _jumpToBible: jumpToBible,
    _addToBible: addToBible
  };

  function generateChapter() {
    if (!activeChapter()) {
      toast("请先新建并选择章节");
      return;
    }
    // 不传 userPrompt，由后端 buildUserPrompt 用 summary 模板生成
    streamGenerate("chapter_generate", "");
  }

  function continueChapter() {
    var ed = editor();
    if (!activeChapter() || !ed || !ed.value.trim()) {
      toast("请先选择章节并输入一些内容");
      return;
    }
    streamGenerate("chapter_continue", buildChapterPrompt("请从当前正文结尾自然续写。"));
  }
})();
