<!--  AI ACTIONS — 前端 AI 调用桥接层                                -->
<!-- ============================================================ -->
<script>
var AIActions = (function () {

  var editorEl = null;
  function getEditor() {
    if (!editorEl) editorEl = document.getElementById("editor");
    return editorEl;
  }

  /** Core: call /api/generate SSE and stream result into editor */
  function _streamGenerate(task, promptText) {
    var editor = getEditor();
    if (!editor) return;

    LayoutSkill.showToast("🤖 AI 生成中…");
    editor.disabled = true;

    fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        task: task,
        userPrompt: promptText,
        maxTokens: 4096
      })
    }).then(function (response) {
      if (!response.ok) throw new Error("HTTP " + response.status);

      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buffer = "";
      var result = "";
      var isDemo = false;

      function read() {
        reader.read().then(function (chunk) {
          if (chunk.done) {
            editor.disabled = false;
            LayoutSkill.showToast(isDemo ? "✅ 演示内容已生成" : "✅ 生成完成");
            return;
          }

          buffer += decoder.decode(chunk.value, { stream: true });
          var lines = buffer.split("\n");
          buffer = lines.pop() || "";

          lines.forEach(function (line) {
            var trimmed = line.trim();
            if (!trimmed || !trimmed.startsWith("data: ")) return;
            var data = trimmed.slice(6);
            try {
              var json = JSON.parse(data);
              if (json.token) {
                result += json.token;
                editor.value = result;
                editor.scrollTop = editor.scrollHeight;
              }
              if (json.status === "demo") {
                isDemo = true;
                LayoutSkill.showToast("📝 演示模式（需配置 API Key）");
              }
              if (json.done) return;
              if (json.error) {
                editor.disabled = false;
                LayoutSkill.showToast("❌ " + json.error);
                return;
              }
            } catch (e) {}
          });

          read();
        }).catch(function (err) {
          editor.disabled = false;
          LayoutSkill.showToast("❌ " + err.message);
        });
      }

      read();
    }).catch(function (err) {
      editor.disabled = false;
      LayoutSkill.showToast("❌ 请求失败: " + err.message);
    });
  }

  return {
    generateChapter: function () {
      var editor = getEditor();
      var chTitle = document.getElementById("ch-title");
      var promptText = "请根据以下大纲生成一章完整内容：\n" + (chTitle ? chTitle.textContent : "新章节");
      _streamGenerate("chapter_generate", promptText);
    },

    continueChapter: function () {
      var editor = getEditor();
      var currentText = editor ? (editor.value || "").slice(-500) : "";
      if (!currentText.trim()) {
        LayoutSkill.showToast("请先选择章节或输入一些内容");
        return;
      }
      var promptText = "请续写以下内容，保持风格一致：\n\n" + currentText;
      _streamGenerate("chapter_continue", promptText);
    },

    rewriteChapter: function () {
      var editor = getEditor();
      var selectedText = "";
      if (editor && editor.selectionStart !== undefined) {
        selectedText = editor.value.substring(editor.selectionStart, editor.selectionEnd);
      }
      if (!selectedText.trim()) {
        LayoutSkill.showToast("请先选中要重写的文本段落");
        return;
      }
      var promptText = "请重写以下内容，保持核心情节不变，优化表达：\n\n" + selectedText;
      _streamGenerate("chapter_rewrite", promptText);
    },

    polishChapter: function () {
      var editor = getEditor();
      var selectedText = "";
      if (editor && editor.selectionStart !== undefined) {
        selectedText = editor.value.substring(editor.selectionStart, editor.selectionEnd);
      }
      if (!selectedText.trim()) {
        LayoutSkill.showToast("请先选中要润色的文本段落");
        return;
      }
      var promptText = "请润色以下内容，修正语病，增强画面感：\n\n" + selectedText;
      _streamGenerate("chapter_polish", promptText);
    },

    generateDialogue: function () {
      var editor = getEditor();
      var contextText = editor ? (editor.value || "").slice(-1000) : "";
      var promptText = "根据以下场景，生成一段生动的角色对话：\n\n" + (contextText || "请先生成章节内容作为上下文");
      _streamGenerate("dialogue_generate", promptText);
    }
  };
})();
</script>
