<body>

<div id="app">
  <div id="topbar">
    <span class="logo">⚔️ NovelOS</span>
    <div class="nav">
      <button class="nav-btn active" data-tab="war" onclick="LayoutSkill.switchTab('war', this)">作战室</button>
      <button class="nav-btn" data-tab="studio" onclick="LayoutSkill.switchTab('studio', this)">创作台</button>
      <button class="nav-btn" data-tab="outline" onclick="LayoutSkill.switchTab('outline', this)">大纲面板</button>
      <button class="nav-btn" data-tab="bible" onclick="LayoutSkill.switchTab('bible', this)">故事圣经</button>
      <button class="nav-btn" data-tab="map" onclick="LayoutSkill.switchTab('map', this)">故事地图</button>
      <button class="nav-btn" data-tab="character" onclick="LayoutSkill.switchTab('character', this)">人物</button>
      <button class="nav-btn" data-tab="future" onclick="LayoutSkill.switchTab('future', this)">未来场景</button>
    </div>
    <span class="project-name" id="topbar-project-name">📖 未选择项目</span>
  </div>

  <!-- WAR ROOM VIEW -->
  <div id="view-war-room" style="display:flex;flex:1;min-height:0"><p style="color:#d4a574;padding:20px">作战室加载中...</p></div>

  <!-- WRITING STUDIO VIEW -->
  <div id="view-studio" style="display:none;flex:1">

  <div id="left-panel">
    <div class="panel-header">🗺️ 故事结构</div>
    <div class="tree" id="story-tree"></div>
  </div>

  <div id="center-panel">
    <div class="editor-toolbar">
      <span class="ch-title" id="ch-title">选择章节开始写作</span>
      <span class="ch-meta" id="ch-meta"></span>
	      <button class="save-btn" id="save-btn" onclick="LayoutSkill.saveChapter()" title="保存 (Ctrl+S)">💾 保存</button>
	      <span class="save-indicator" id="save-indicator"></span>
    </div>
    <div class="ai-actions">
      <button class="ai-btn" id="finalize-btn" onclick="AIActions.finalizeChapter()" title="定稿后自动生成摘要并扫描新设定">✅ 定稿</button>
    </div>
    <div id="editor-area">
      <div class="empty-state" id="empty-state">
        <span class="icon">✍️</span>
        <p>从左侧大纲树选择章节开始写作</p>
      </div>
      <textarea id="editor" style="display:none" placeholder="在这里开始创作…"></textarea>
    </div>
  </div>

  <div id="right-panel">
    <div id="right-content">
      <div id="empty-hint">
        <span style="font-size:36px">🤖</span>
        <p>选择章节后<br>显示 AI 上下文面板</p>
      </div>
    </div>
  </div>

  </div><!-- /view-studio -->

  <!-- STORY BIBLE VIEW -->
  <div id="view-story-bible" style="display:none;flex:1;min-height:0;background:#0b0a12"><p style="color:#d4a574;padding:20px">故事圣经加载中...</p></div>

  <!-- STORY MAP VIEW -->
  <div id="view-story-map" style="display:none;flex:1;min-height:0"><p style="color:#d4a574;padding:20px">故事地图加载中...</p></div>

  <!-- CHARACTER MANAGER VIEW -->
  <div id="view-character-manager" style="display:none;flex:1;min-height:0"><p style="color:#d4a574;padding:20px">人物管理加载中...</p></div>


  <!-- OUTLINE BOARD VIEW -->
  <div id="view-outline-board" style="display:none;flex:1;min-height:0"><p style="color:#d4a574;padding:20px">大纲面板加载中...</p></div>

  <!-- FUTURE SCENE VIEW -->
  <div id="view-future-scene" style="display:none;flex:1;min-height:0"><p style="color:#d4a574;padding:20px">未来场景库加载中...</p></div>

<div id="toast"></div>

</div><!-- /app -->

<script>
(function() {
  var el = document.getElementById('view-story-bible');
  if (!el) return;
  if (typeof StoryBible === 'undefined') {
    el.innerHTML = '<div style="padding:40px;color:#c06060"><h3>加载失败</h3><p>StoryBible 模块未定义。请打开浏览器 Console 查看错误。</p></div>';
    el.style.display = 'flex';
    return;
  }
  if (typeof KnowledgeSkill === 'undefined') {
    el.innerHTML = '<div style="padding:40px;color:#c06060"><h3>加载失败</h3><p>KnowledgeSkill 未定义。知识库模块加载异常。</p></div>';
    el.style.display = 'flex';
    return;
  }
  el.innerHTML = '<p style="color:#5aab8a;padding:20px">模块就绪，正在初始化...</p>';
})();
</script>

<!-- ============================================================ -->
<!--  STUDIO ASSISTANT (independent module)                       -->
<!-- ============================================================ -->
<script src="/modules/studio-assistant/index.js"></script>
<script>
var AIActions = StudioAssistant;
LayoutSkill.init();
try {
  StoryBible.init("view-story-bible", null, "", "");
} catch(e) {
  var el = document.getElementById('view-story-bible');
  if (el) {
    el.innerHTML = '<div style="padding:40px;color:#c06060"><h3>初始化异常</h3><pre>' + e.message + '</pre></div>';
    el.style.display = 'flex';
  }
}
try {
  StoryMap.init("view-story-map", null);
} catch(e) {
  var mel = document.getElementById('view-story-map');
  if (mel) {
    mel.innerHTML = '<div style="padding:40px;color:#c06060"><h3>故事地图初始化异常</h3><pre>' + e.message + '</pre></div>';
    mel.style.display = 'flex';
  }
}
try {
  CharacterManager.init("view-character-manager", null);
} catch(e) {
  var cel = document.getElementById('view-character-manager');
  if (cel) {
    cel.innerHTML = '<div style="padding:40px;color:#c06060"><h3>人物管理初始化异常</h3><pre>' + e.message + '</pre></div>';
    cel.style.display = 'flex';
  }
}
try {
  OutlineBoard.init("view-outline-board", null);
} catch(e) {
  var oel = document.getElementById('view-outline-board');
  if (oel) {
    oel.innerHTML = '<div style="padding:40px;color:#c06060"><h3>大纲面板初始化异常</h3><pre>' + e.message + '</pre></div>';
    oel.style.display = 'flex';
  }
}
try {
  WarRoom.init("view-war-room", null);
} catch(e) {
  var wrel = document.getElementById('view-war-room');
  if (wrel) {
    wrel.innerHTML = '<div style="padding:40px;color:#c06060"><h3>作战室初始化异常</h3><pre>' + e.message + '</pre></div>';
    wrel.style.display = 'flex';
  }
}
try {
  FutureScene.init("view-future-scene", null);
} catch(e) {
  var fsel = document.getElementById('view-future-scene');
  if (fsel) {
    fsel.innerHTML = '<div style="padding:40px;color:#c06060"><h3>未来场景库初始化异常</h3><pre>' + e.message + '</pre></div>';
    fsel.style.display = 'flex';
  }
}
</script>
